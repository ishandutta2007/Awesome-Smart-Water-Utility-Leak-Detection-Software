<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040d1a" />
      <stop offset="50%" stop-color="#091b33" />
      <stop offset="100%" stop-color="#051329" />
    </linearGradient>

    <!-- Cyan/Blue Accent Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00b4d8" />
      <stop offset="50%" stop-color="#48cae4" />
      <stop offset="100%" stop-color="#90e0ef" />
    </linearGradient>

    <!-- Badge Gradient -->
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#0096c7" />
    </linearGradient>

    <!-- Card Pill Gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0a1d33" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .pulse-ring-1 {
        animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        transform-origin: 750px 160px;
      }
      .pulse-ring-2 {
        animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        animation-delay: 1.2s;
        transform-origin: 750px 160px;
      }
      .pulse-ring-3 {
        animation: pulseRing 3.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        animation-delay: 2.4s;
        transform-origin: 750px 160px;
      }
      .flow-line {
        stroke-dasharray: 8, 8;
        animation: flowDash 20s linear infinite;
      }
      .flow-line-reverse {
        stroke-dasharray: 6, 6;
        animation: flowDashReverse 15s linear infinite;
      }
      .node-pulse {
        animation: nodeBlink 2.5s ease-in-out infinite alternate;
      }
      .radar-sweep {
        animation: radarRotate 8s linear infinite;
        transform-origin: 750px 160px;
      }
      .floating-particle {
        animation: floatY 4s ease-in-out infinite alternate;
      }

      @keyframes pulseRing {
        0% {
          r: 12px;
          opacity: 0.8;
          stroke-width: 2.5px;
        }
        80% {
          opacity: 0.15;
        }
        100% {
          r: 95px;
          opacity: 0;
          stroke-width: 0.5px;
        }
      }
      @keyframes flowDash {
        to {
          stroke-dashoffset: -320;
        }
      }
      @keyframes flowDashReverse {
        to {
          stroke-dashoffset: 240;
        }
      }
      @keyframes nodeBlink {
        0% {
          opacity: 0.5;
          transform: scale(0.95);
        }
        100% {
          opacity: 1;
          transform: scale(1.08);
        }
      }
      @keyframes radarRotate {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes floatY {
        0% {
          transform: translateY(0px);
        }
        100% {
          transform: translateY(-6px);
        }
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect width="900" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e3a5f" stroke-width="1.5" />

  <!-- Background Technical Grid (Subtle) -->
  <g opacity="0.08" stroke="#00b4d8" stroke-width="0.75">
    <line x1="40" y1="0" x2="40" y2="320" />
    <line x1="120" y1="0" x2="120" y2="320" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="280" y1="0" x2="280" y2="320" />
    <line x1="360" y1="0" x2="360" y2="320" />
    <line x1="440" y1="0" x2="440" y2="320" />
    <line x1="520" y1="0" x2="520" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="680" y1="0" x2="680" y2="320" />
    <line x1="760" y1="0" x2="760" y2="320" />
    <line x1="840" y1="0" x2="840" y2="320" />

    <line x1="0" y1="40" x2="900" y2="40" />
    <line x1="0" y1="100" x2="900" y2="100" />
    <line x1="0" y1="160" x2="900" y2="160" />
    <line x1="0" y1="220" x2="900" y2="220" />
    <line x1="0" y1="280" x2="900" y2="280" />
  </g>

  <!-- Dynamic Water Pipeline Network (Background Visuals - strictly non-obscuring) -->
  <g opacity="0.45">
    <!-- Pipe vectors -->
    <path d="M 520 270 L 620 270 L 670 210 L 750 210 L 750 160" fill="none" stroke="#0077b6" stroke-width="2" />
    <path d="M 670 210 L 710 250 L 820 250" fill="none" stroke="#0077b6" stroke-width="2" />
    <path d="M 580 90 L 650 90 L 710 130 L 750 160" fill="none" stroke="#0077b6" stroke-width="2" />
    <path d="M 750 160 L 830 110 L 880 110" fill="none" stroke="#0077b6" stroke-width="2" />

    <!-- Flow animation strokes along pipes -->
    <path class="flow-line" d="M 520 270 L 620 270 L 670 210 L 750 160 L 830 110 L 880 110" fill="none" stroke="#48cae4" stroke-width="2.5" />
    <path class="flow-line-reverse" d="M 580 90 L 650 90 L 710 130 L 750 160 L 710 250 L 820 250" fill="none" stroke="#90e0ef" stroke-width="1.8" />

    <!-- Minor pipe telemetry nodes -->
    <circle cx="620" cy="270" r="4" fill="#00b4d8" />
    <circle cx="670" cy="210" r="4" fill="#00b4d8" />
    <circle cx="650" cy="90" r="4" fill="#00b4d8" />
    <circle cx="820" cy="250" r="4" fill="#00b4d8" />
    <circle cx="830" cy="110" r="4" fill="#00b4d8" />
  </g>

  <!-- Dynamic Acoustic & Sensor Telemetry Hub (Right Side - 750, 160) -->
  <g>
    <!-- Dynamic Radar Sweeper & Ripple Rings -->
    <circle class="pulse-ring-1" cx="750" cy="160" r="14" fill="none" stroke="#00f5d4" opacity="0.7" />
    <circle class="pulse-ring-2" cx="750" cy="160" r="14" fill="none" stroke="#48cae4" opacity="0.7" />
    <circle class="pulse-ring-3" cx="750" cy="160" r="14" fill="none" stroke="#00b4d8" opacity="0.7" />

    <!-- Static sensor target rings -->
    <circle cx="750" cy="160" r="45" fill="none" stroke="#1f4268" stroke-dasharray="3, 3" stroke-width="1" />
    <circle cx="750" cy="160" r="80" fill="none" stroke="#163252" stroke-dasharray="4, 4" stroke-width="1" />

    <!-- Sensor Hub Central Beacon -->
    <circle cx="750" cy="160" r="16" fill="#03045e" stroke="#00b4d8" stroke-width="2" filter="url(#softGlow)" />
    <circle class="node-pulse" cx="750" cy="160" r="8" fill="#00f5d4" filter="url(#glow)" />
    <circle cx="750" cy="160" r="3" fill="#ffffff" />

    <!-- Telemetry Label -->
    <text x="750" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#48cae4" letter-spacing="1">SENSOR DMA-04</text>
    <text x="750" y="209" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="9" font-weight="500" fill="#72efdd">LEAK PINPOINTED ±0.5m</text>
  </g>

  <!-- Floating Ambient Data Nodes -->
  <g class="floating-particle">
    <circle cx="680" cy="70" r="2" fill="#90e0ef" opacity="0.6" />
    <circle cx="560" cy="200" r="2.5" fill="#48cae4" opacity="0.5" />
    <circle cx="850" cy="190" r="2" fill="#00f5d4" opacity="0.7" />
  </g>

  <!-- FOREGROUND CONTENT: Header, Titles, Pills (Clean, crisp, unobstructed) -->
  <g id="foreground">
    <!-- Top Pill Badge -->
    <g transform="translate(50, 42)">
      <rect width="250" height="28" rx="14" fill="url(#badgeGrad)" opacity="0.9" />
      <circle cx="16" cy="14" r="5" fill="#00f5d4" filter="url(#softGlow)" />
      <text x="30" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" letter-spacing="0.8">SMART WATER ECOSYSTEM</text>
      <rect x="208" y="5" width="34" height="18" rx="9" fill="#03045e" />
      <text x="225" y="17.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#00f5d4">2026</text>
    </g>

    <!-- Main Title -->
    <text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Smart Water Utility
    </text>
    <text x="50" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="url(#waterGrad)" letter-spacing="-0.5">
      Leak Detection Software
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="50" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#cbd5e1" letter-spacing="0.2">
      Curated directory of SaaS intelligence platforms, acoustic IoT networks,
    </text>
    <text x="50" y="210" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      satellite SAR monitoring &amp; open-source hydraulic digital twins.
    </text>

    <!-- Feature Attribute Chips / Pills -->
    <g transform="translate(50, 246)">
      <!-- Pill 1 -->
      <g>
        <rect width="135" height="32" rx="16" fill="url(#pillGrad)" stroke="#1e4570" stroke-width="1.2" />
        <text x="14" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">💧 NRW Reduction</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(145, 0)">
        <rect width="145" height="32" rx="16" fill="url(#pillGrad)" stroke="#1e4570" stroke-width="1.2" />
        <text x="14" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🛰️ Satellite SAR &amp; AI</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(300, 0)">
        <rect width="155" height="32" rx="16" fill="url(#pillGrad)" stroke="#1e4570" stroke-width="1.2" />
        <text x="14" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚙️ Hydraulic Twins</text>
      </g>
    </g>
  </g>
</svg>
